name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'

    - name: Read version from pubspec
      id: version
      run: |
        VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Install dependencies
      run: flutter pub get

    - name: Generate database code
      run: flutter pub run build_runner build --delete-conflicting-outputs 2>&1 || true

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: lingzhi-app
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30

    - name: Create GitHub Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        files: build/app/outputs/flutter-apk/app-release.apk
        tag_name: v${{ steps.version.outputs.version }}
        name: 灵智 v${{ steps.version.outputs.version }}
        body: |
          ## 灵智 AI 助手应用

          **版本**: v${{ steps.version.outputs.version }}
          **构建时间**: ${{ github.event.head_commit.timestamp }}
          **提交**: ${{ github.sha }}

          ### 功能特性
          - 智能聊天（Gemini API）
          - 本地图片生成
          - 音乐播放器
          - 聊天历史持久化

          ### 安装说明
          1. 下载此 APK 文件
          2. 在 Android 设备上允许安装未知来源应用
          3. 安装并运行

          ### 注意事项
          - 首次使用需在设置中配置 Gemini API Key
          - 需要 Android 8.0+ 系统
          - 需要网络连接使用 AI 功能
        draft: false
        prerelease: false