name: ai_agent_mobile_app
description: 灵智 - 智能AI助手应用，集成聊天、图片生成、音乐播放功能
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 数据库
  drift: ^2.16.1
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.3
  path: ^1.9.0

  # Gemini API
  google_generative_ai: ^0.4.6

  # 音乐播放
  just_audio: ^0.9.38

  # 网络请求
  dio: ^5.4.3+1

  # 本地存储
  shared_preferences: ^2.2.3

  # 文件管理
  file_picker: ^8.0.3

  # Android 定时任务
  workmanager: ^0.5.2

  # 图片处理
  image: ^4.2.2
  # 常量
  flutter_svg: ^2.0.10+1

  # 通知
  flutter_local_notifications: ^17.1.2

  # 音频服务（后台播放）
  audio_service: ^0.18.15

  # UUID生成
  uuid: ^4.4.0

  # 国际化
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.16.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true